# AI Box lab broker: eclipse-mosquitto 2.1.2
# The whole ./mosquitto/config dir is mounted over /mosquitto/config, replacing the image's default
# config (which allows anonymous access and opens an HTTP API on 9883).

# One plain MQTT listener inside the container. No host port is published in docker-compose.yml,
# so only containers on the compose network can reach it. Add TLS before exposing it anywhere else.
listener 1883
protocol mqtt
allow_anonymous false

# Auth: Mosquitto 2.1 plugin form (password_file/acl_file options are deprecated).
# Each plugin_opt_* applies to the plugin line just above it, so keep this order.
# passwd and acl are generated by scripts/bootstrap.sh (owner 1883:1883, mode 0600).
plugin /usr/lib/mosquitto_password_file.so
plugin_opt_password_file /mosquitto/config/passwd

plugin /usr/lib/mosquitto_acl_file.so
plugin_opt_acl_file /mosquitto/config/acl

# Persistence keeps QoS 1 sessions (insights ingest) across broker restarts.
# Frigate per-camera MQTT snapshots are disabled, so no retained images are persisted (GDPR).
persistence true
persistence_location /mosquitto/data/
autosave_interval 300

log_dest stdout
log_dest file /mosquitto/log/mosquitto.log
log_type error
log_type warning
log_type notice
log_type information
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S
connection_messages true
