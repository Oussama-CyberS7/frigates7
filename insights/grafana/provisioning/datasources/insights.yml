apiVersion: 1

datasources:
  - name: Insights TimescaleDB
    uid: insights-tsdb
    type: grafana-postgresql-datasource
    access: proxy
    url: timescaledb:5432
    # Read-only role (SELECT on insights tables/views only).
    user: grafana_reader
    isDefault: true
    editable: false
    jsonData:
      database: insights
      sslmode: disable  # Docker network only (insights network, no published port)
      postgresVersion: 1700
      timescaledb: true
      maxOpenConns: 5
    secureJsonData:
      password: $GRAFANA_DB_PASSWORD
